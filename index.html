<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>誠家團隊 好禮獎不完</title>

  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --text: #1d1d1f;
      --text-dim: #6e6e73;
      --accent: #0071e3;
      --accent-press: #0062c4;
      --brand: #c8283f;
      --gold: #d8ac5c;
      --line: rgba(0, 0, 0, 0.09);
      --shadow-lg: 0 18px 50px rgba(0, 0, 0, 0.20);
      --danger: #ff3b30;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html { -webkit-text-size-adjust: 100%; }

    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
        "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(env(safe-area-inset-top, 0px) + 54px) 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
      margin: 0;
      height: 100vh;
      min-height: 100vh;
      max-height: 100vh;
      height: 100dvh;
      min-height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      position: fixed;
      inset: 0;
      width: 100%;
      gap: clamp(4px, 1.2vh, 14px);
      gap: clamp(4px, 1.2dvh, 14px);
      -webkit-font-smoothing: antialiased;
    }

    .eyebrow-tag {
      display: inline-block;
      background: #ececef;
      color: var(--text-dim);
      font-size: clamp(11px, 2.6vw, 13px);
      font-weight: 500;
      padding: clamp(4px, 1vh, 7px) 16px;
      border-radius: 999px;
      margin: 0;
      flex: none;
      animation: rise 0.6s ease both;
    }

    h1 {
      font-size: clamp(22px, 6.6vw, 40px);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
      text-align: center;
      color: var(--brand);
      flex: none;
      animation: rise 0.6s 0.06s ease both;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: clamp(12px, 3vw, 16px);
      margin: 0;
      text-align: center;
      flex: none;
      animation: rise 0.6s 0.12s ease both;
    }

    .spin-hint {
      color: var(--text-dim);
      font-size: 12px;
      margin: 0;
      flex: none;
      animation: rise 0.6s 0.34s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: none; }
    }

    /* ---------- 轉盤 ---------- */
    /* 轉盤區塊吃掉剩下的高度，轉盤依可用空間自動縮放，不會超出畫面 */
    .wheel-area {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 6px 8px;
      container-type: size;
    }
    .wheel-container {
      position: relative;
      width: 240px;
      height: 240px;
      width: min(100cqw, 100cqh, 520px);
      height: min(100cqw, 100cqh, 520px);
      flex: none;
      animation: rise 0.75s 0.18s ease both;
    }

    .wheel-glow {
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      background: conic-gradient(from 0deg,
        #FF6B6B, #FFD43B, #4ECDC4, #5C7CFA, #9775FA, #FF922B, #FF6B6B);
      filter: blur(26px);
      opacity: 0.35;
      z-index: 0;
      animation: rotate 16s linear infinite;
    }

    @keyframes rotate { to { transform: rotate(360deg); } }

    /* 靜止不轉動的外殼，負責圓角陰影 — 避免 iOS Safari 在
       transform 動畫期間，圓角元素疊加陰影造成的四角閃爍/失效問題 */
    .wheel-shell {
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: 50%;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.16), 0 3px 10px rgba(0, 0, 0, 0.08);
      pointer-events: none;
    }

    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      width: clamp(28px, 9%, 40px);
      height: clamp(36px, 11.5%, 52px);
      background: var(--text);
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      border-radius: 5px;
      z-index: 10;
      transform: translateX(-50%) rotate(0deg);
      transform-origin: 50% 92%;
      transition: transform 0.13s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 5px 7px rgba(0, 0, 0, 0.28));
    }

    canvas#wheel {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
      transform: rotate(0deg);
    }

    /* 固定不隨轉盤旋轉的中心標籤 */
    .wheel-hub {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.25;
      color: var(--brand);
      font-weight: 700;
      font-size: clamp(9px, 2.1vw, 14px);
      letter-spacing: 0.03em;
      pointer-events: none;
      user-select: none;
    }

    /* ---------- 按鈕 ---------- */
    .btn {
      font-family: inherit;
      font-size: 17px;
      font-weight: 500;
      border: none;
      border-radius: 980px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.2s ease;
      flex: none;
    }

    .btn:active { transform: scale(0.96); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      padding: clamp(12px, 2.2vh, 18px) clamp(40px, 10vw, 62px);
      padding: clamp(12px, 2.2dvh, 18px) clamp(40px, 10vw, 62px);
      font-size: clamp(16px, 4vw, 20px);
      box-shadow: 0 6px 20px rgba(0, 113, 227, 0.28);
      animation: rise 0.6s 0.28s ease both;
    }

    .btn-primary:not(:disabled) { animation: breathe 2.6s ease-in-out infinite; }
    .btn-primary:hover { background: var(--accent-press); }
    .btn-primary:disabled {
      background: #c7c7cc;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
      animation: none;
    }
    .btn-primary.is-spinning { animation: none; }

    @keyframes breathe {
      0%, 100% { box-shadow: 0 6px 20px rgba(0, 113, 227, 0.28); }
      50%      { box-shadow: 0 12px 34px rgba(0, 113, 227, 0.46); }
    }

    .admin-toggle {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 14px);
      right: calc(env(safe-area-inset-right, 0px) + 14px);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border: 1px solid var(--line);
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 500;
      padding: 9px 16px;
      min-height: 38px;
      border-radius: 980px;
      cursor: pointer;
      z-index: 40;
    }
    .admin-toggle:hover { background: rgba(255, 255, 255, 0.98); }

    /* ---------- 中獎揭曉 ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    .reveal-bg {
      position: fixed;
      left: var(--rx, 50%);
      top: var(--ry, 42%);
      width: 26px;
      height: 26px;
      margin: -13px 0 0 -13px;
      border-radius: 50%;
      background: var(--accent);
      transform: scale(0);
      transition: transform 0.72s cubic-bezier(0.66, 0, 0.34, 1);
      z-index: 1;
    }
    .overlay.reveal-go .reveal-bg { transform: scale(170); }

    .modal-card {
      position: relative;
      z-index: 2;
      background: var(--surface);
      padding: 40px 34px 30px;
      border-radius: 30px;
      text-align: center;
      width: 380px;
      max-width: 88vw;
      max-height: 88vh;
      max-height: 88dvh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transform: scale(0.8) translateY(12px);
      transition: opacity 0.4s ease, transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .overlay.card-in .modal-card { opacity: 1; transform: none; }

    .modal-card .eyebrow {
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0 0 8px;
    }
    .modal-card h2 {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    #prizeImage {
      display: none;
      width: 100%;
      max-height: min(260px, 32vh);
      max-height: min(260px, 32dvh);
      object-fit: contain;
      margin: 20px auto 6px;
      border-radius: 18px;
      background: var(--bg);
    }
    #prizeName {
      font-size: 24px;
      font-weight: 700;
      color: var(--brand);
      margin: 16px 0 26px;
    }
    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      padding: 14px 40px;
      width: 100%;
    }
    .btn-secondary:hover { background: #ececec; }

    #fx {
      position: fixed;
      inset: 0;
      z-index: 52;
      pointer-events: none;
    }

    /* ---------- 後台 ---------- */
    .panel {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      height: 100dvh;
      width: 430px;
      max-width: 100vw;
      background: rgba(250, 250, 252, 0.88);
      backdrop-filter: saturate(180%) blur(30px);
      -webkit-backdrop-filter: saturate(180%) blur(30px);
      box-shadow: -8px 0 40px rgba(0, 0, 0, 0.12);
      z-index: 60;
      transform: translateX(100%);
      transition: transform 0.44s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }
    .panel.open { transform: translateX(0); }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px 14px;
      border-bottom: 1px solid var(--line);
    }
    .panel-head h2 { font-size: 20px; font-weight: 600; margin: 0; }

    .icon-btn {
      background: rgba(0, 0, 0, 0.05);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 15px;
      color: var(--text-dim);
      cursor: pointer;
    }
    .icon-btn:hover { background: rgba(0, 0, 0, 0.1); }

    .panel-scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 18px 20px; }

    .pass-gate {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 40px 8px;
      text-align: center;
    }
    .pass-gate p { margin: 0; color: var(--text-dim); font-size: 15px; }

    .field, .pass-gate input {
      font-family: inherit;
      font-size: 16px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fff;
      color: var(--text);
      width: 100%;
      outline: none;
      transition: border-color 0.16s, box-shadow 0.16s;
    }
    .field:focus, .pass-gate input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
    }
    .err { color: var(--danger) !important; font-size: 13px !important; }

    .field-label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .list-head {
      font-size: 14px;
      color: var(--text-dim);
      margin: 2px 2px 12px;
    }
    .list-head span { color: var(--text); font-weight: 600; }

    /* 摺疊獎品卡 */
    .prize-row {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .prize-summary {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
    }
    .prize-summary .badge {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: var(--bg);
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .prize-summary .p-title {
      flex: 1;
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .prize-summary .p-pct {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .prize-summary .chev {
      color: var(--text-dim);
      font-size: 11px;
      transition: transform 0.25s;
    }
    .prize-row.open .chev { transform: rotate(180deg); }

    .prize-detail {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.32s ease;
    }
    .prize-row.open .prize-detail { max-height: 460px; }

    .detail-inner {
      padding: 2px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .detail-inner label {
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .detail-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
    }
    .detail-foot .live-pct { font-size: 13px; color: var(--text-dim); }
    .del-btn {
      background: rgba(255, 59, 48, 0.1);
      color: var(--danger);
      border: none;
      padding: 8px 16px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .del-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .ghost-btn {
      font-family: inherit;
      background: none;
      border: 1px dashed var(--line);
      color: var(--accent);
      font-size: 15px;
      font-weight: 500;
      padding: 12px;
      width: 100%;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 4px;
    }
    .ghost-btn:hover { background: rgba(0, 113, 227, 0.05); }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 18px 2px 4px;
      font-size: 14px;
      color: var(--text-dim);
    }
    .total-row span {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .hint {
      font-size: 12px;
      color: var(--text-dim);
      margin: 4px 2px 0;
      line-height: 1.55;
    }

    .panel-actions {
      display: flex;
      gap: 10px;
      padding: 14px 20px calc(env(safe-area-inset-bottom, 0px) + 16px);
      border-top: 1px solid var(--line);
      background: rgba(250, 250, 252, 0.96);
    }
    .panel-actions button {
      flex: 1;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      padding: 13px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }
    .panel-actions .primary-btn { background: var(--accent); color: #fff; }
    .panel-actions .primary-btn:hover { background: var(--accent-press); }
    .panel-actions .plain-btn { background: rgba(0, 0, 0, 0.05); color: var(--text); }
    .panel-actions .plain-btn:hover { background: rgba(0, 0, 0, 0.1); }
    .panel-actions .primary-btn:disabled { background: #c7c7cc; cursor: not-allowed; }

    .total-row.bad span:last-child { color: var(--danger); }
    .total-row.ok span:last-child { color: #1f9d55; }
    .total-msg { font-size: 13px; margin: 2px 2px 0; min-height: 18px; }
    .total-msg.bad { color: var(--danger); }
    .total-msg.ok { color: #1f9d55; }

    .pct-wrap { position: relative; }
    .pct-wrap .field { padding-right: 34px; }
    .pct-wrap::after {
      content: '%';
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 15px;
      pointer-events: none;
    }

    /* 手機：後台全螢幕 */
    @media (max-width: 520px) {
      .panel { width: 100vw; }
    }
    /* 很矮的螢幕（橫放或小手機）：縮小文字與間距 */
    @media (max-height: 600px) {
      .subtitle, .spin-hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }

    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: 55;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .backdrop.show { opacity: 1; pointer-events: auto; }

    [hidden] { display: none !important; }
  </style>
  <script>
    window.addEventListener('error', function (e) {
      var box = document.getElementById('debugError');
      if (!box) return;
      box.hidden = false;
      box.textContent += '錯誤: ' + e.message + '\n來源: ' + (e.filename || '') + ' 第' + (e.lineno || '?') + '行\n\n';
    });
  </script>
</head>

<body>

  <div id="debugError" hidden style="position:fixed;left:10px;right:10px;bottom:10px;z-index:999;background:#fff3f3;border:1px solid #ffb3b3;color:#b00020;font:12px/1.5 monospace;padding:10px;border-radius:10px;white-space:pre-wrap;max-height:45vh;overflow:auto;"></div>

  <button class="admin-toggle" id="adminToggle">⚙ 後台</button>

  <p class="eyebrow-tag" id="eyebrowTag">誠家團隊抽獎活動</p>
  <h1>好禮獎不完 <span aria-hidden="true">🎁</span></h1>
  <p class="subtitle">按下按鈕，看看今天的幸運好禮是什麼！</p>

  <div class="wheel-area">
  <div class="wheel-container">
    <div class="wheel-glow"></div>
    <div class="wheel-shell"></div>
    <div class="pointer"></div>
    <canvas id="wheel" width="700" height="700"></canvas>
    <div class="wheel-hub"><span>LUCKY</span><span>DRAW</span></div>
  </div>
  </div>

  <button class="btn btn-primary" id="spinBtn" type="button">立即抽獎</button>
  <p class="spin-hint">每次點擊只會進行一次抽獎</p>

  <canvas id="fx"></canvas>

  <!-- 中獎揭曉 -->
  <div class="overlay" id="resultModal">
    <div class="reveal-bg" id="revealBg"></div>
    <div class="modal-card">
      <p class="eyebrow">Congratulations</p>
      <h2>恭喜中獎</h2>
      <img id="prizeImage" src="" alt="獎品圖片" onerror="this.style.display='none'">
      <div id="prizeName"></div>
      <button class="btn btn-secondary" id="closeResult">完成</button>
    </div>
  </div>

  <!-- 後台 -->
  <div class="backdrop" id="panelBackdrop"></div>
  <aside class="panel" id="adminPanel">
    <div class="panel-head">
      <h2>後台設定</h2>
      <button class="icon-btn" id="closeAdmin">✕</button>
    </div>

    <div class="panel-scroll">
      <div class="pass-gate" id="passGate">
        <p>請輸入通行碼以進入後台</p>
        <input id="passInput" type="password" inputmode="numeric" maxlength="12" placeholder="通行碼" autocomplete="off">
        <button class="ghost-btn" id="passBtn" style="border-style:solid;margin-top:0;">進入</button>
        <p class="err" id="passErr" hidden>通行碼錯誤，請再試一次</p>
      </div>

      <div id="adminBody" hidden>
        <div class="list-head" style="margin-bottom:6px;">頁面標題</div>
        <label class="field-label">
          標籤文字（顯示在主標題上方）
          <input class="field" id="titleInput" type="text" maxlength="30" placeholder="誠家團隊抽獎活動">
        </label>
        <button class="ghost-btn" id="saveTitle" style="margin:8px 0 18px;">儲存標題</button>

        <div class="list-head" style="margin-bottom:6px;">變更通行碼</div>
        <label class="field-label">
          新通行碼（至少 6 碼）
          <input class="field" id="newPass1" type="password" autocomplete="new-password">
        </label>
        <label class="field-label" style="margin-top:8px;">
          再輸入一次
          <input class="field" id="newPass2" type="password" autocomplete="new-password">
        </label>
        <p class="total-msg" id="passMsg"></p>
        <button class="ghost-btn" id="savePass" style="margin:4px 0 18px;">變更通行碼</button>

        <div class="list-head">共 <span id="prizeCount">0</span> 個獎品，點一下展開設定</div>
        <div id="prizeList"></div>
        <button class="ghost-btn" id="addPrize">＋ 新增獎品</button>

        <div class="total-row" id="totalRow">
          <span style="font-size:14px;font-weight:400;color:var(--text-dim);">機率合計</span>
          <span><span id="totalPct">100</span>%</span>
        </div>
        <p class="total-msg" id="totalMsg"></p>
        <p class="hint">
          輸入的數字就是中獎機率（%），全部加起來必須剛好 100% 才能儲存。
          獎品會依機率由大到小排列。轉盤扇形一律等分顯示，不會透露中獎機率。
          按「儲存並套用」或關閉後台後會自動登出。
        </p>
      </div>
    </div>

    <div class="panel-actions" id="adminActions" hidden>
      <button class="plain-btn" id="resetPrizes">重設為預設</button>
      <button class="primary-btn" id="savePrizes">儲存並套用</button>
    </div>
  </aside>

  <script>
    // =========================================
    // 設定
    // =========================================
    // 後台通行碼只存「加密雜湊值」，原始碼裡看不到通行碼本身
    // 預設通行碼的雜湊；在後台「變更通行碼」後，新的雜湊會存在這支手機上並優先使用
    const PASS_SALT = 'chengjia-lottery-2026';
    const PASS_ROUNDS = 20000;
    const DEFAULT_PASS_HASH = '8a8dbe222c8aeb3beaa1c7ef8ec0a7996067da4bfdd221409c59c7c576249e43';
    const PASS_KEY = 'chengjia_lottery_pass_v1';
    const STORAGE_KEY = 'chengjia_lottery_v3';
    const TITLE_KEY = 'chengjia_lottery_title_v1';
    const DEFAULT_TITLE = '誠家團隊抽獎活動';

    const DEFAULT_PRIZES = [
      { name: 'TCL65吋電視機', prob: 1, image: 'https://i.postimg.cc/sX3BjF36/dian-shi.jpg' },
      { name: 'SHARP電子鎖', prob: 2, image: 'https://i.postimg.cc/Pr0PLvtb/dian-zi-suo.jpg' },
      { name: 'DYSON吹風機', prob: 3, image: 'https://i.postimg.cc/tRMh5TqR/chui-feng-ji.jpg' },
      { name: 'SAMSUNG無線吸塵器', prob: 4, image: 'https://i.postimg.cc/Dy0xvHZx/xi-chen-qi.jpg' },
      { name: 'LG掃地機器人', prob: 5, image: 'https://i.postimg.cc/kX2y3S1b/sao-de-ji-qi-ren.jpg' },
      { name: 'SHARP空氣清淨機', prob: 5, image: 'https://i.postimg.cc/7L89NLNT/kong-qi-qing-jing-ji.jpg' },
      { name: 'SHARP除濕機', prob: 6, image: 'https://i.postimg.cc/LhF5bGQG/chu-shi-ji.jpg' },
      { name: 'RECOLTE氣炸烤箱', prob: 10, image: 'https://i.postimg.cc/2SfLcLPj/qi-zha-kao-xiang.jpg' },
      { name: 'LG微波爐', prob: 27, image: 'https://i.postimg.cc/J4Xpggzg/wei-bo-lu.jpg' },
      { name: '全聯禮券', prob: 37, image: 'https://i.postimg.cc/NFSfrZwf/li-quan.jpg' }
    ];

    const COLORS = [
      '#FF6B6B', '#4ECDC4', '#5C7CFA', '#FFD43B', '#9775FA',
      '#FF922B', '#20C997', '#748FFC', '#F783AC', '#63E6BE',
      '#FFA94D', '#3BC9DB', '#B197FC', '#FFE066', '#8CE99A'
    ];

    // 轉盤幾何
    const CX = 350, CY = 350, R = 322, HUB = 56;

    // =========================================
    // SHA-256（純 JS，不依賴 https 也能運作）
    // =========================================
    const sha256 = (function () {
      const K = new Uint32Array([
        0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
        0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
        0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
        0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
        0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
        0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
        0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
        0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
      const W = new Uint32Array(64);
      const rotr = (x, n) => (x >>> n) | (x << (32 - n));
      return function (bytes) {
        const len = bytes.length;
        const total = ((len + 9 + 63) >> 6) << 6;
        const m = new Uint8Array(total);
        m.set(bytes); m[len] = 0x80;
        const bits = len * 8;
        m[total - 4] = bits >>> 24; m[total - 3] = bits >>> 16; m[total - 2] = bits >>> 8; m[total - 1] = bits;
        let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
        for (let o = 0; o < total; o += 64) {
          for (let i = 0; i < 16; i++) W[i] = (m[o+i*4] << 24) | (m[o+i*4+1] << 16) | (m[o+i*4+2] << 8) | m[o+i*4+3];
          for (let i = 16; i < 64; i++) {
            const a = W[i-15], b = W[i-2];
            W[i] = (W[i-16] + (rotr(a,7) ^ rotr(a,18) ^ (a >>> 3)) + W[i-7] + (rotr(b,17) ^ rotr(b,19) ^ (b >>> 10))) | 0;
          }
          let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
          for (let i = 0; i < 64; i++) {
            const t1 = (h + (rotr(e,6) ^ rotr(e,11) ^ rotr(e,25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
            const t2 = ((rotr(a,2) ^ rotr(a,13) ^ rotr(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
            h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
          }
          h0=(h0+a)|0; h1=(h1+b)|0; h2=(h2+c)|0; h3=(h3+d)|0; h4=(h4+e)|0; h5=(h5+f)|0; h6=(h6+g)|0; h7=(h7+h)|0;
        }
        const out = new Uint8Array(32);
        [h0,h1,h2,h3,h4,h5,h6,h7].forEach((v, i) => { out[i*4]=v>>>24; out[i*4+1]=v>>>16; out[i*4+2]=v>>>8; out[i*4+3]=v; });
        return out;
      };
    })();

    // 加鹽 + 重複雜湊多次，讓通行碼很難被反推
    function hashPass(code) {
      let d = sha256(new TextEncoder().encode(PASS_SALT + ':' + code));
      for (let i = 1; i < PASS_ROUNDS; i++) d = sha256(d);
      return Array.from(d, b => b.toString(16).padStart(2, '0')).join('');
    }
    function currentPassHash() {
      try { return localStorage.getItem(PASS_KEY) || DEFAULT_PASS_HASH; } catch (e) { return DEFAULT_PASS_HASH; }
    }

    // =========================================
    // 狀態
    // =========================================
    const num = v => (Number(v) > 0 ? Number(v) : 0);
    const round2 = v => Math.round(v * 100) / 100;
    const byProbDesc = (a, b) => num(b.prob) - num(a.prob);

    let prizes = loadPrizes();
    let wheelOrder = [];          // 轉盤上的顯示順序（打亂後的獎品索引）
    function shuffleWheel() {
      wheelOrder = prizes.map((_, i) => i);
      for (let i = wheelOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [wheelOrder[i], wheelOrder[j]] = [wheelOrder[j], wheelOrder[i]];
      }
    }
    shuffleWheel();
    let pageTitle = loadTitle();
    let draft = [];
    let openItem = null;          // 目前展開的獎品（用物件記住，排序後不會跑掉）
    let spinning = false;
    let currentRotation = 0;


    function loadPrizes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const p = JSON.parse(raw);
          if (Array.isArray(p) && p.length >= 2) return p.slice().sort(byProbDesc);
        }
      } catch (e) { /* ignore */ }
      return DEFAULT_PRIZES.map(p => ({ ...p })).sort(byProbDesc);
    }
    function persist() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(prizes)); } catch (e) { /* ignore */ }
    }
    function loadTitle() {
      try {
        const raw = localStorage.getItem(TITLE_KEY);
        if (raw) return raw;
      } catch (e) { /* ignore */ }
      return DEFAULT_TITLE;
    }
    function persistTitle() {
      try { localStorage.setItem(TITLE_KEY, pageTitle); } catch (e) { /* ignore */ }
    }

    // =========================================
    // 元素
    // =========================================
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const overlay = document.getElementById('resultModal');
    const revealBg = document.getElementById('revealBg');
    const prizeNameEl = document.getElementById('prizeName');
    const prizeImage = document.getElementById('prizeImage');
    const pointer = document.querySelector('.pointer');
    const fx = document.getElementById('fx');
    const eyebrowTag = document.getElementById('eyebrowTag');
    eyebrowTag.textContent = pageTitle;

    // =========================================
    // 扇形計算
    // =========================================
    function totalWeight() {
      return prizes.reduce((s, p) => s + num(p.prob), 0);
    }
    // 轉盤扇形一律「等分」，不透露任何中獎機率
    // 轉盤順序隨機（每次開啟頁面、儲存設定時重新打亂），與後台排序無關
    function segments() {
      const n = prizes.length;
      const frac = 1 / n;
      return wheelOrder.map(k => prizes[k]).map((p, i) => ({
        startFrac: i * frac,
        frac,
        start: i * frac * 2 * Math.PI,
        end: (i + 1) * frac * 2 * Math.PI,
        prize: p
      }));
    }

    // =========================================
    // 圖片預載
    // =========================================
    function preloadImages() {
      prizes.forEach(p => { if (p.image) { const i = new Image(); i.src = p.image; } });
    }

    // =========================================
    // 畫轉盤
    // =========================================
    function drawWheel(opts) {
      opts = opts || {};
      const highlight = opts.highlight == null ? -1 : opts.highlight;
      const grow = opts.grow || 0;
      const fade = opts.fade || 0;

      ctx.clearRect(0, 0, 700, 700);
      const segs = segments();
      const n = segs.length;
      const fs = Math.max(14, Math.min(28, 230 / n));

      segs.forEach((s, i) => {
        const isHi = i === highlight;
        let r = R, cx = CX, cy = CY;
        if (isHi) {
          const mid = (s.start + s.end) / 2;
          r = R + 22 * grow;
          cx = CX + Math.cos(mid) * 16 * grow;
          cy = CY + Math.sin(mid) * 16 * grow;
        }
        ctx.globalAlpha = (highlight >= 0 && !isHi) ? (1 - 0.8 * fade) : 1;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, s.start, s.end);
        ctx.closePath();
        ctx.fillStyle = COLORS[i % COLORS.length];
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.stroke();

        // 名稱（不顯示百分比）
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate((s.start + s.end) / 2);
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        let label = s.prize.name || '';
        ctx.font = `600 ${isHi ? fs + 3 : fs}px -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif`;
        const maxW = 232;
        while (ctx.measureText(label).width > maxW && label.length > 1) label = label.slice(0, -1);
        if (label !== (s.prize.name || '')) label += '…';
        ctx.fillStyle = '#1d1d1f';
        ctx.fillText(label, r - 34, 1);
        ctx.restore();
      });

      ctx.globalAlpha = 1;

      // 外圈：金色點綴 + 白色分隔環
      ctx.beginPath();
      ctx.arc(CX, CY, R + 5, 0, 2 * Math.PI);
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#d8ac5c';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(CX, CY, R, 0, 2 * Math.PI);
      ctx.lineWidth = 7;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      // 中心（文字改由固定不轉動的 .wheel-hub DOM 元素顯示）
      ctx.beginPath();
      ctx.arc(CX, CY, HUB, 0, 2 * Math.PI);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(0,0,0,0.06)';
      ctx.stroke();
    }

    // =========================================
    // 依權重抽獎
    // =========================================
    function getRandomPrizeIndex() {
      const total = totalWeight();
      if (total <= 0) return Math.floor(Math.random() * prizes.length);
      const r = Math.random() * total;
      let sum = 0;
      for (let i = 0; i < prizes.length; i++) {
        sum += num(prizes[i].prob);
        if (r < sum) return i;
      }
      return prizes.length - 1;
    }

    // =========================================
    // 指針彈跳
    // =========================================
    let pointerT;
    function nudgePointer() {
      pointer.style.transform = 'translateX(-50%) rotate(-17deg)';
      clearTimeout(pointerT);
      pointerT = setTimeout(() => { pointer.style.transform = 'translateX(-50%) rotate(0deg)'; }, 55);
    }

    // =========================================
    // 轉動（rAF 緩動，可同步指針彈跳）
    // =========================================
    function spin() {
      if (spinning) return;
      spinning = true;
      spinBtn.disabled = true;
      spinBtn.classList.add('is-spinning');

      const prizeIdx = getRandomPrizeIndex();
      const idx = wheelOrder.indexOf(prizeIdx);   // 該獎品在轉盤上的位置
      const segs = segments();
      const s = segs[idx];
      const prize = prizes[prizeIdx];
      const color = COLORS[idx % COLORS.length];

      const midDeg = (s.startFrac + s.frac / 2) * 360;
      const from = currentRotation;
      const to = from + 6 * 360 + (270 - midDeg) - (from % 360);
      currentRotation = to;

      const dur = 4700;
      const t0 = performance.now();
      let lastSeg = -1;

      function frame(now) {
        let t = (now - t0) / dur;
        if (t > 1) t = 1;
        const e = 1 - Math.pow(1 - t, 4);           // easeOutQuart
        const deg = from + (to - from) * e;
        canvas.style.transform = `rotate(${deg}deg)`;

        const atTop = ((((270 - deg) % 360) + 360) % 360) / 360;
        let segNow = 0;
        for (let i = 0; i < segs.length; i++) {
          if (atTop >= segs[i].startFrac && atTop < segs[i].startFrac + segs[i].frac) { segNow = i; break; }
        }
        if (lastSeg !== -1 && segNow !== lastSeg) nudgePointer();
        lastSeg = segNow;

        if (t < 1) requestAnimationFrame(frame);
        else finishSpin(prize, color, idx);
      }
      requestAnimationFrame(frame);
    }

    spinBtn.addEventListener('click', spin);

    // 中獎扇形逐漸放大 → 揭曉畫面
    function finishSpin(prize, color, idx) {
      spinBtn.classList.remove('is-spinning');
      const g0 = performance.now();
      (function grow(now) {
        let t = Math.min(1, (now - g0) / 620);
        const e = 1 - Math.pow(1 - t, 3);
        drawWheel({ highlight: idx, grow: e, fade: e });
        if (t < 1) requestAnimationFrame(grow);
        else revealWin(prize, color);
      })(g0);
    }

    function revealWin(prize, color) {
      const rect = canvas.getBoundingClientRect();
      overlay.style.setProperty('--rx', (rect.left + rect.width / 2) + 'px');
      overlay.style.setProperty('--ry', (rect.top + rect.height / 2) + 'px');
      revealBg.style.background = color;
      overlay.classList.add('show');
      void revealBg.offsetWidth;
      overlay.classList.add('reveal-go');

      setTimeout(() => {
        prizeNameEl.textContent = `「${prize.name}」`;
        if (prize.image) {
          prizeImage.src = prize.image;
          prizeImage.style.display = 'block';
        } else {
          prizeImage.style.display = 'none';
          prizeImage.src = '';
        }
        overlay.classList.add('card-in');
        confetti(color);
      }, 650);
    }

    function closeResult() {
      overlay.classList.remove('show', 'reveal-go', 'card-in');
      spinning = false;
      spinBtn.disabled = false;
      pointer.style.transform = 'translateX(-50%) rotate(0deg)';
      drawWheel();
    }
    document.getElementById('closeResult').addEventListener('click', closeResult);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeResult(); });

    // =========================================
    // 彩帶
    // =========================================
    function confetti(main) {
      fx.width = innerWidth;
      fx.height = innerHeight;
      const c = fx.getContext('2d');
      const pal = [main, '#FFD43B', '#4ECDC4', '#FF6B6B', '#5C7CFA', '#ffffff'];
      const parts = Array.from({ length: 150 }, () => ({
        x: Math.random() * fx.width,
        y: -20 - Math.random() * fx.height * 0.4,
        w: 5 + Math.random() * 7,
        col: pal[Math.random() * pal.length | 0],
        vx: -2.5 + Math.random() * 5,
        vy: 2.5 + Math.random() * 4.5,
        rot: Math.random() * 6.28,
        vr: -0.25 + Math.random() * 0.5
      }));
      const t0 = performance.now();
      (function loop(now) {
        const el = now - t0;
        c.clearRect(0, 0, fx.width, fx.height);
        parts.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vy += 0.045; p.rot += p.vr;
          c.save();
          c.translate(p.x, p.y);
          c.rotate(p.rot);
          c.globalAlpha = Math.max(0, 1 - el / 3400);
          c.fillStyle = p.col;
          c.fillRect(-p.w / 2, -p.w / 2, p.w, p.w * 0.6);
          c.restore();
        });
        if (el < 3400) requestAnimationFrame(loop);
        else c.clearRect(0, 0, fx.width, fx.height);
      })(t0);
    }

    // =========================================
    // 後台
    // =========================================
    const adminPanel = document.getElementById('adminPanel');
    const panelBackdrop = document.getElementById('panelBackdrop');
    const passGate = document.getElementById('passGate');
    const passInput = document.getElementById('passInput');
    const passErr = document.getElementById('passErr');
    const adminBody = document.getElementById('adminBody');
    const adminActions = document.getElementById('adminActions');
    const prizeList = document.getElementById('prizeList');
    const totalPctEl = document.getElementById('totalPct');
    let unlocked = false;

    function openPanel() {
      adminPanel.classList.add('open');
      panelBackdrop.classList.add('show');
      if (unlocked) return enterAdmin();
      passGate.hidden = false;
      adminBody.hidden = true;
      adminActions.hidden = true;
      passErr.hidden = true;
      passInput.value = '';
      setTimeout(() => passInput.focus(), 300);
    }
    // 關閉後台 = 登出，下次進入要重新輸入通行碼
    function closePanel() {
      adminPanel.classList.remove('open');
      panelBackdrop.classList.remove('show');
      logout();
    }
    function logout() {
      unlocked = false;
      draft = [];
      openItem = null;
      prizeList.innerHTML = '';
      passInput.value = '';
      ['newPass1', 'newPass2'].forEach(id => { document.getElementById(id).value = ''; });
      document.getElementById('passMsg').textContent = '';
      passGate.hidden = false;
      adminBody.hidden = true;
      adminActions.hidden = true;
      if (document.activeElement) document.activeElement.blur();
    }
    document.getElementById('adminToggle').addEventListener('click', openPanel);
    document.getElementById('closeAdmin').addEventListener('click', closePanel);
    panelBackdrop.addEventListener('click', closePanel);

    document.getElementById('passBtn').addEventListener('click', tryUnlock);
    passInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
    function tryUnlock() {
      if (hashPass(passInput.value) === currentPassHash()) { unlocked = true; passInput.blur(); enterAdmin(); }
      else passErr.hidden = false;
    }

    function enterAdmin() {
      passGate.hidden = true;
      adminBody.hidden = false;
      adminActions.hidden = false;
      titleInput.value = pageTitle;
      draft = prizes.map(p => ({ ...p })).sort(byProbDesc);
      openItem = null;
      renderPrizeList();
    }

    const titleInput = document.getElementById('titleInput');
    document.getElementById('saveTitle').addEventListener('click', () => {
      const v = titleInput.value.trim();
      pageTitle = v || DEFAULT_TITLE;
      titleInput.value = pageTitle;
      persistTitle();
      eyebrowTag.textContent = pageTitle;
    });

    document.getElementById('savePass').addEventListener('click', () => {
      const a = document.getElementById('newPass1');
      const b = document.getElementById('newPass2');
      const msg = document.getElementById('passMsg');
      const bad = t => { msg.className = 'total-msg bad'; msg.textContent = t; };
      if (a.value.length < 6) return bad('通行碼至少要 6 碼');
      if (a.value !== b.value) return bad('兩次輸入的通行碼不一樣');
      try { localStorage.setItem(PASS_KEY, hashPass(a.value)); }
      catch (e) { return bad('無法儲存，請確認不是無痕模式'); }
      a.value = b.value = '';
      msg.className = 'total-msg ok';
      msg.textContent = '✓ 通行碼已變更，下次登入請使用新通行碼';
    });

    function draftTotal() { return round2(draft.reduce((s, p) => s + num(p.prob), 0)); }
    function sortDraft() { draft.sort(byProbDesc); }

    function renderPrizeList() {
      prizeList.innerHTML = '';
      document.getElementById('prizeCount').textContent = draft.length;

      draft.forEach((p, i) => {
        const row = document.createElement('div');
        row.className = 'prize-row' + (p === openItem ? ' open' : '');
        row.innerHTML = `
          <button class="prize-summary" type="button">
            <span class="badge">${i + 1}</span>
            <span class="p-title">${escapeHtml(p.name || '未命名')}</span>
            <span class="p-pct">${fmt(num(p.prob))}%</span>
            <span class="chev">⌄</span>
          </button>
          <div class="prize-detail"><div class="detail-inner">
            <label>獎品名稱
              <input class="field p-name" type="text" value="${escapeAttr(p.name)}">
            </label>
            <label>獎品圖片網址（選填）
              <input class="field p-image" type="url" placeholder="https://…" value="${escapeAttr(p.image || '')}">
            </label>
            <label>中獎機率（%）
              <span class="pct-wrap">
                <input class="field p-prob" type="text" inputmode="decimal" placeholder="0" value="${num(p.prob) ? fmt(num(p.prob)) : ''}">
              </span>
            </label>
            <div class="detail-foot">
              <span class="live-pct"></span>
              <button class="del-btn" type="button" ${draft.length <= 2 ? 'disabled' : ''}>刪除</button>
            </div>
          </div></div>`;
        prizeList.appendChild(row);

        row.querySelector('.prize-summary').addEventListener('click', () => {
          openItem = (openItem === p) ? null : p;
          renderPrizeList();
        });
        row.querySelector('.p-name').addEventListener('input', e => {
          p.name = e.target.value;
          row.querySelector('.p-title').textContent = e.target.value || '未命名';
        });
        row.querySelector('.p-image').addEventListener('input', e => {
          p.image = e.target.value.trim();
        });
        const probInput = row.querySelector('.p-prob');
        probInput.addEventListener('input', e => {
          const v = parseFloat(e.target.value);
          p.prob = isFinite(v) && v > 0 ? round2(v) : 0;
          row.querySelector('.p-pct').textContent = fmt(p.prob) + '%';
          refreshTotal();
        });
        // 輸入完成（離開欄位 / 按鍵盤完成）後重新依機率排序
        probInput.addEventListener('change', () => {
          sortDraft();
          renderPrizeList();
        });
        row.querySelector('.del-btn').addEventListener('click', () => {
          if (draft.length <= 2) return;
          draft.splice(draft.indexOf(p), 1);
          openItem = null;
          renderPrizeList();
        });
      });
      refreshTotal();
    }

    function fmt(v) { return String(round2(v)); }

    function refreshTotal() {
      const total = draftTotal();
      const diff = round2(100 - total);
      const ok = Math.abs(diff) < 0.005;
      totalPctEl.textContent = fmt(total);
      const row = document.getElementById('totalRow');
      const msg = document.getElementById('totalMsg');
      row.classList.toggle('ok', ok);
      row.classList.toggle('bad', !ok);
      msg.className = 'total-msg ' + (ok ? 'ok' : 'bad');
      msg.textContent = ok ? '✓ 合計剛好 100%，可以儲存'
        : diff > 0 ? `還差 ${fmt(diff)}%，才能儲存` : `超出 ${fmt(-diff)}%，請調低某些獎品`;
      document.getElementById('savePrizes').disabled = !ok;
    }

    document.getElementById('addPrize').addEventListener('click', () => {
      const item = { name: '新獎品', prob: 0, image: '' };
      draft.push(item);
      openItem = item;
      renderPrizeList();
      const row = prizeList.children[draft.indexOf(item)];
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    document.getElementById('resetPrizes').addEventListener('click', () => {
      if (!confirm('確定要還原成預設獎品與機率嗎？')) return;
      draft = DEFAULT_PRIZES.map(p => ({ ...p })).sort(byProbDesc);
      openItem = null;
      renderPrizeList();
    });

    document.getElementById('savePrizes').addEventListener('click', () => {
      const cleaned = draft.map(p => ({
        name: (p.name || '').trim() || '未命名獎品',
        image: (p.image || '').trim(),
        prob: round2(num(p.prob))
      }));
      if (cleaned.length < 2) return alert('至少需要 2 個獎品');
      const total = round2(cleaned.reduce((s, p) => s + p.prob, 0));
      if (Math.abs(total - 100) >= 0.005) return alert(`機率合計目前是 ${fmt(total)}%，必須剛好 100% 才能儲存`);

      // 輸入多少就存多少，不再自動換算
      prizes = cleaned.sort(byProbDesc);
      shuffleWheel();
      persist();
      const tv = titleInput.value.trim();
      pageTitle = tv || DEFAULT_TITLE;
      persistTitle();
      eyebrowTag.textContent = pageTitle;
      preloadImages();
      currentRotation = 0;
      canvas.style.transform = 'rotate(0deg)';
      drawWheel();
      closePanel();
    });

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escapeAttr(s) {
      return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closePanel(); if (overlay.classList.contains('show')) closeResult(); }
    });

    // =========================================
    // 初始化
    // =========================================
    preloadImages();
    drawWheel();
  </script>

</body>

</html>
